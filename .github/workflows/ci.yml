name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8
  KTLINT_VERSION: 1.8.0
  DETEKT_VERSION: 1.23.8

jobs:
  dart:
    name: Dart format, analyze, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: flutter test
        working-directory: app/example
      - run: flutter pub publish --dry-run

  android:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Building the example also generates example/android's Gradle wrapper,
      # which the unit-test step below needs.
      - run: flutter build apk --debug
        working-directory: app/example
      - run: ./gradlew :device_shield:testDebugUnitTest
        working-directory: app/example/android

  kotlin-lint:
    name: Kotlin lint (ktlint, detekt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install ktlint and detekt
        run: |
          curl -sSLo ktlint "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x ktlint
          curl -sSLo detekt.jar "https://github.com/detekt/detekt/releases/download/v${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}-all.jar"
      - run: ./ktlint "app/android/src/**/*.kt"
      - run: >-
          java -jar detekt.jar
          --input app/android/src/main/kotlin,app/android/src/test/kotlin
          --config app/android/config/detekt.yml
          --build-upon-default-config

  ios:
    name: iOS lint and build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: swift-format
        run: >-
          swift format lint --strict --recursive
          ios/device_shield/Sources ios/device_shield/Tests
          example/ios/Runner example/ios/RunnerTests
      - name: SwiftLint
        run: |
          command -v swiftlint || brew install swiftlint
          swiftlint lint
      # Flutter can't resolve the Swift package of a plugin example nested in
      # a folder whose name differs from the package (`app` vs `device_shield`),
      # so build the example from a correctly named copy. See F10 in docs/HANDOVER.md.
      - name: Build example (simulator)
        run: |
          cp -R . "$RUNNER_TEMP/device_shield"
          cd "$RUNNER_TEMP/device_shield/example"
          flutter build ios --simulator --debug --no-codesign
