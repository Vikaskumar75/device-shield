# Static analysis for the device_shield package. The example app includes
# this file, so both are held to the same rules.
#
# Baseline: flutter_lints (the Flutter team's recommended set). The rules
# below add what matters for a published security library: strict typing,
# no silently dropped futures or streams, and documented public API.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Promote the checks that indicate real bugs from info to warning, so
    # CI (`flutter analyze`, which fails on warnings) catches them.
    unawaited_futures: warning
    cancel_subscriptions: warning
    close_sinks: warning
    avoid_dynamic_calls: warning

linter:
  rules:
    # Correctness
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_statements

    # Public API of a published package. `public_member_api_docs` is
    # deliberately not enabled yet: the public surface is due to be reshaped
    # (see CONTRIBUTING.md), and documenting members that are about to be
    # removed is wasted work. Enable it once the v0.1 API is settled.
    - always_declare_return_types
    - type_annotate_public_apis

    # Consistency
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - unnecessary_lambdas
    - avoid_redundant_argument_values
